<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Switchboard — Evening changeover</title>
<style>
:root{--paper:#f4f0e8;--white:#fffcf6;--ink:#242523;--muted:#62635b;--line:#d5cec0;--red:#9e3827;--red-light:#f7e4db;--green:#315d48;--amber:#845019;--mono:Consolas,'Liberation Mono',monospace}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #236c8b;outline-offset:3px}h1,h2,h3,p{margin:0}button,input{touch-action:manipulation}.wrap{max-width:1336px;margin:auto;padding-inline:40px}.mast{background:#242523;color:#fcf7ed}.top{height:66px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #494941}.brand{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:750;letter-spacing:-.03em}.logo{display:grid;grid-auto-flow:column;align-items:center;gap:3px;height:31px;width:33px;justify-content:center;background:#bf4935}.logo i{width:3px;background:#fff5e7}.logo i:nth-child(1),.logo i:nth-child(5){height:7px}.logo i:nth-child(2),.logo i:nth-child(4){height:13px}.logo i:nth-child(3){height:21px}.eyebrow{font:700 11px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase}.top .eyebrow{color:#d4cbbb}.hero{display:flex;align-items:end;justify-content:space-between;gap:24px;padding-block:31px 35px}.hero .eyebrow{color:#df9987;margin-bottom:10px}h1{font-size:clamp(36px,5.1vw,73px);line-height:.98;font-weight:750;letter-spacing:-.068em}.clock{display:flex;gap:24px;flex:none}.clock div{padding-left:17px;border-left:1px solid #616158}.clock small{display:block;color:#d4cbbb;margin-bottom:5px}.clock strong{display:block;font:500 34px/1 var(--mono);letter-spacing:-.08em}.clock .fixed strong{color:#ffad94}.track{height:4px;background:repeating-linear-gradient(90deg,#bc4d37 0 2px,#2f302b 2px 14px)}
.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:28px;padding-block:30px 38px;align-items:start}.sheet,.detail{min-width:0}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:15px}.section-heading h2{font-size:25px;letter-spacing:-.045em}.count{color:var(--muted)}.rows{border:1px solid var(--line);background:var(--white)}.cue{border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;display:grid;grid-template-columns:60px minmax(0,1fr) 48px 12px;align-items:center;text-align:left;gap:11px;padding:14px 15px;min-height:75px;position:relative}.cue:last-child{border-bottom:0}.cue:hover{background:#f1ebdf}.cue[aria-current=true]{background:#f3e7db;box-shadow:inset 4px 0 var(--red)}.time,.duration{font-family:var(--mono);font-variant-numeric:tabular-nums}.time{font-size:16px;font-weight:700}.duration{font-size:13px;color:var(--muted);text-align:right}.cue-title{display:block;font-weight:720;line-height:1.22;margin-bottom:5px}.status{display:flex;gap:6px;align-items:center;color:var(--green);font-size:12px;line-height:1.25}.status::before{content:"";height:6px;width:6px;background:currentColor;border-radius:50%;flex:none}.status.wait{color:var(--red)}.status.deadline{color:var(--amber)}.status.boundary{color:#52524c}.status.boundary::before{border-radius:0}.cue:last-child{border-top:2px solid #57574d}.arrow{color:var(--muted);font-size:18px}.sheet-foot{color:var(--muted);font-size:12px;padding-top:13px}
.detail{background:var(--white);border:1px solid var(--line);border-top:4px solid var(--red);padding:20px 22px}.detail header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.detail header .eyebrow{color:var(--muted)}.detail h2{font-size:clamp(23px,2.45vw,34px);letter-spacing:-.048em;line-height:1.08;margin-bottom:10px}.facts{display:grid;grid-template-columns:repeat(3,1fr);margin-block:17px;border-block:1px solid var(--line);padding-block:11px;gap:4px}.facts dt{color:var(--muted);font-size:11px;margin-bottom:3px}.facts dd{font:700 16px/1.1 var(--mono);margin:0}.note{font-size:14px;color:var(--muted)}.options h3{font-size:16px;margin-bottom:9px}.option{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:1px solid var(--line);padding:9px 11px;margin-bottom:7px;min-height:49px}.option:hover{background:#f4eee2}.option[aria-pressed=true]{border-color:var(--red);background:#fbefe6}.option b{display:block;font-size:13px;line-height:1.25}.option small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.option .duration{font-size:12px}.fit{background:#2b2c28;color:#fff6e8;margin:12px 0;padding:11px 13px}.fit-labels{display:flex;justify-content:space-between;gap:8px;font:12px var(--mono)}.fit-track{height:7px;position:relative;margin:10px 0;background:#56564f}.fit-track::after{content:"";position:absolute;left:80%;height:13px;top:-3px;width:2px;background:#fff6e8}.fit-track span{display:block;height:7px;background:#a8cfac}.fit-track.conflict span{background:#ff9b81}.fit p{font-size:12px;color:#e4dacb}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}.primary,.secondary{min-height:42px;padding:8px 12px;font-size:13px;font-weight:700;border:1px solid var(--line);background:transparent}.primary{background:var(--red);border-color:var(--red);color:#fff8ec}.primary:hover{background:#7c2d20}.secondary:hover{background:#f0e8db}.notice{padding:10px 12px;background:#e7efe4;color:#274633;font-size:13px;margin:10px 0}.notice.restored{background:#f3e7db;color:#71351f}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:850px){.wrap{padding-inline:22px}.layout{gap:17px;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr)}.detail{padding:16px}.cue{grid-template-columns:47px minmax(0,1fr) 36px 8px;gap:8px;padding-inline:12px}}
@media(max-width:660px){.wrap{padding-inline:17px}.top{height:54px}.top .eyebrow{font-size:9px}.brand{font-size:18px}.logo{width:28px;height:28px}.hero{display:block;padding-block:23px 20px}.hero .eyebrow{margin-bottom:6px}h1{font-size:clamp(35px,10.8vw,59px);max-width:100%}.clock{gap:20px;margin-top:19px}.clock div{padding-left:10px}.clock strong{font-size:25px}.clock small{font-size:9px;margin-bottom:4px}.layout{display:block;padding-block:19px 24px}.section-heading{margin-bottom:10px}.section-heading h2{font-size:22px}.cue{min-height:64px;padding-block:10px}.cue-title{font-size:14px}.time{font-size:14px}.detail{margin-top:19px;scroll-margin-top:12px}.sheet-foot{display:none}}
</style>
</head>
<body>
<div class="mast"><div class="wrap">
  <header class="top"><div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>Switchboard</div><span class="eyebrow">Studio rundown</span></header>
  <div class="hero"><div><p class="eyebrow">18:42–19:00</p><h1>Evening changeover</h1></div>
    <div class="clock"><div><small class="eyebrow">Studio clock</small><strong>18:42</strong></div><div class="fixed"><small class="eyebrow">Fixed handoff</small><strong>19:00</strong></div></div>
  </div>
</div></div>
<div class="track" aria-hidden="true"></div>
<main class="wrap layout">
  <section class="sheet" aria-labelledby="rundown-heading">
    <div class="section-heading"><h2 id="rundown-heading">On-air sequence</h2><span id="count" class="eyebrow count"></span></div>
    <div id="rows" class="rows"></div>
    <p class="sheet-foot">All cue times are local studio time.</p>
  </section>
  <section id="detail" class="detail" aria-labelledby="detail-title"></section>
  <div id="announcement" class="sr" role="status"></div>
</main>
<script>
const cues = [
  {start:1123,title:'East Market weather',seconds:45,status:'Ready',note:'Weather bulletin for East Market.'},
  {start:1124,title:'Harbor ferry suspension notice',seconds:80,status:'Ready · Air before 18:50',tone:'deadline',note:'Air this notice before 18:50. The scheduled cue ends at 18:45:20.'},
  {start:1126,title:'Mara Chen on the night bus pilot',seconds:330,status:'Awaiting audio',tone:'wait'},
  {start:1132,title:'Listener recordings from North Jetty',seconds:190,status:'Ready',note:'The North Jetty recordings start at 18:52.'},
  {start:1140,title:'Station identification and news handoff',seconds:30,status:'Fixed boundary',tone:'boundary',note:'The news handoff starts at 19:00.'}
];
const backups = [
  {title:'Depot shift before dawn',seconds:225,status:'Ready',source:'Studio recording'},
  {title:'West platforms accessibility call-in',seconds:450,status:'Ready',source:'Backup'}
];
const interview = 2;
const limit = (cues[3].start - cues[interview].start) * 60;
let selected = interview;
let preview = 0;
let applied = false;
let restored = false;
const rows = document.querySelector('#rows');
const detail = document.querySelector('#detail');
const announcement = document.querySelector('#announcement');
const pad = value => String(value).padStart(2,'0');
const duration = seconds => Math.floor(seconds / 60) + ':' + pad(seconds % 60);
const time = (minutes, seconds) => {
  const total = minutes * 60 + (seconds || 0);
  return pad(Math.floor(total / 3600)) + ':' + pad(Math.floor(total / 60) % 60)
    + (seconds === undefined ? '' : ':' + pad(total % 60));
};
function current(index) {
  return index === interview && applied ? {...cues[index], ...backups[0], tone:''} : cues[index];
}
function render() {
  rows.innerHTML = cues.map((_, index) => {
    const cue = current(index);
    return '<button class="cue" data-cue="' + index + '" aria-controls="detail" aria-current="' + (selected === index) + '"><span class="time">' + time(cue.start) + '</span><span><span class="cue-title">' + cue.title + '</span><span class="status ' + (cue.tone || '') + '">' + cue.status + '</span></span><span class="duration">' + duration(cue.seconds) + '</span><span class="arrow" aria-hidden="true">›</span></button>';
  }).join('');
  document.querySelector('#count').textContent = applied ? '5 cues · All set' : '5 cues · 1 awaiting audio';
  const cue = current(selected);
  const isInterview = selected === interview;
  detail.innerHTML = '<header><span class="eyebrow">Cue detail · ' + time(cue.start) + '</span><span class="status ' + (cue.tone || '') + '">' + cue.status + '</span></header>'
    + '<h2 tabindex="-1" id="detail-title">' + cue.title + '</h2>'
    + '<dl class="facts"><div><dt>Start</dt><dd>' + time(cue.start) + '</dd></div><div><dt>Duration</dt><dd>' + duration(cue.seconds) + '</dd></div><div><dt>Ends</dt><dd>' + time(cue.start,cue.seconds) + '</dd></div></dl>'
    + (isInterview && applied ? '<p class="notice">Replacement in the rundown. The 18:46 cue stays in place.</p>'
      : isInterview ? (restored ? '<p class="notice restored">Original interview restored.</p>' : '') + replacementOptions(cue)
      : '<p class="note">' + cue.note + '</p>')
    + '<div class="actions">'
    + (isInterview && applied ? '<button class="secondary" id="undo">Undo replacement</button>' : '')
    + (isInterview && !applied && backups[preview].seconds <= limit ? '<button class="primary" id="apply">Use replacement</button>' : '')
    + (selected < cues.length-1 ? '<button class="secondary" id="next">Next cue · ' + time(cues[selected+1].start) + ' →</button>' : '')
    + (!isInterview ? '<button class="secondary" id="return">Return to 18:46</button>' : '')
    + '</div>';
}
function replacementOptions(cue) {
  const option = backups[preview];
  const conflict = option.seconds > limit;
  return '<div class="options"><h3>Replacement audio</h3>'
    + backups.map((backup,index) => '<button class="option" data-option="' + index + '" aria-pressed="' + (preview === index) + '"><span><b>' + backup.title + '</b><small>' + backup.source + ' · Ready</small></span><span class="duration">' + duration(backup.seconds) + '</span></button>').join('')
    + '</div><div id="fit" class="fit"><div class="fit-labels"><span>Start 18:46</span><span>Next 18:52</span></div><div class="fit-track ' + (conflict ? 'conflict' : '') + '" aria-hidden="true"><span style="width:' + option.seconds / 450 * 100 + '%"></span></div><p>'
    + (conflict ? 'Ends at ' + time(cue.start,option.seconds) + ' · overlaps North Jetty by ' + duration(option.seconds-limit) + '. Original cue stays selected.'
      : 'Ends at ' + time(cue.start,option.seconds) + ' · ' + duration(limit-option.seconds) + ' before North Jetty.')
    + '</p></div>';
}
function openCue(index) {
  selected = index;
  render();
  document.querySelector('#detail-title').focus({preventScroll:true});
  if (matchMedia('(max-width:660px)').matches) detail.scrollIntoView({block:'start'});
}
rows.addEventListener('click', event => {
  const button = event.target.closest('[data-cue]');
  if (button) openCue(Number(button.dataset.cue));
});
detail.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  if (button.hasAttribute('data-option')) {
    preview = Number(button.dataset.option);
    render();
    detail.querySelector('[data-option="' + preview + '"]').focus({preventScroll:true});
    announcement.textContent = document.querySelector('#fit p').textContent;
  }
  if (button.id === 'apply' || button.id === 'undo') {
    applied = button.id === 'apply';
    restored = !applied;
    render();
    document.querySelector('#detail-title').focus();
    announcement.textContent = applied ? 'Depot shift before dawn is in the rundown. Ends at 18:49:45.' : 'Original interview restored. Ends at 18:51:30.';
  }
  if (button.id === 'next') openCue(selected + 1);
  if (button.id === 'return') openCue(interview);
});
render();
</script>
</body>
</html>
