<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Switchboard — Evening changeover</title>
<style>
:root{color-scheme:dark;--bg:#13141a;--panel:#1c1e27;--line:#353744;--text:#f5f2eb;--muted:#aeb0bf;--lime:#d7f88b;--amber:#ffc482;--purple:#c8b9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:2px solid var(--lime);outline-offset:3px}button:disabled{opacity:.48;cursor:default}.mono,time,.eyebrow,.tag,.timing{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}.shell{width:min(1272px,calc(100% - 96px));margin:auto}.top{border-bottom:1px solid var(--line)}.top .shell{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;letter-spacing:-.6px}.mark{width:34px;height:34px;border-radius:8px;background:var(--lime);color:#191d13;display:flex;justify-content:center;align-items:center;gap:3px}.mark i{width:3px;background:currentColor;border-radius:3px;height:9px}.mark i:nth-child(2),.mark i:nth-child(4){height:15px}.mark i:nth-child(3){height:22px}.clock{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.clock time{color:var(--text);font-size:17px}.dot{height:7px;width:7px;border-radius:50%;background:var(--lime);display:inline-block;flex:none}.hero{display:grid;grid-template-columns:1fr 245px;gap:24px;align-items:end;padding:39px 0 30px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:0 0 8px}.hero .eyebrow{color:var(--lime)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(32px,4.4vw,64px);line-height:1.02;letter-spacing:-.06em;margin-bottom:12px}.hero p:last-child{margin-bottom:0;color:var(--muted)}.boundary{border:1px solid #4c4265;background:#242035;border-radius:12px;padding:13px 17px}.boundary .eyebrow{color:var(--purple);margin:0}.boundary time{font-size:29px;color:var(--purple);letter-spacing:-1px}.boundary small{display:block;color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:22px;align-items:start;padding-bottom:35px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.panel-head{padding:19px 21px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.panel-head h2{margin:0;font-size:21px;letter-spacing:-.5px}.status{font-size:11px;white-space:nowrap;color:var(--amber)}.status.clear{color:var(--lime)}.columns{display:grid;grid-template-columns:63px 1fr 48px;gap:11px;padding:7px 21px;background:#181a22;color:var(--muted);font-size:10px;letter-spacing:1.1px;text-transform:uppercase}.rows{padding:0 9px}.row{width:100%;display:grid;grid-template-columns:63px minmax(0,1fr) 48px;gap:11px;text-align:left;align-items:center;background:none;border:1px solid transparent;border-bottom-color:var(--line);padding:12px 11px;min-height:70px}.row:last-child{border-bottom-color:transparent}.row:hover{background:#242630}.row[aria-pressed=true]{background:#2d2b27;border:1px solid #776449;border-radius:8px}.row time{font-size:17px;letter-spacing:-.5px}.name{display:block;font-weight:680;line-height:1.22}.tag{display:block;font-size:10px;margin-top:5px;color:var(--lime)}.tag.wait{color:var(--amber)}.tag.fixed{color:var(--purple)}.duration{font-size:12px;color:var(--muted);text-align:right}.legend{padding:12px 21px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.detail{padding:20px}.detail-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.detail-top .eyebrow{margin:0}.pill{border:1px solid #706047;color:var(--amber);padding:3px 8px;border-radius:20px;font-size:10px}.pill.ready{color:var(--lime);border-color:#596747}.pill.fixed{color:var(--purple);border-color:#5d5078}.detail h2{font-size:26px;line-height:1.12;letter-spacing:-.75px;margin-bottom:12px}.timing{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:12px}.timing strong{color:var(--text);font-size:15px}.description{margin:12px 0 15px;color:var(--muted);font-size:13px}.alternates{border-top:1px solid var(--line);padding-top:13px}.alternates h3{font-size:13px;margin-bottom:8px}.option{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;width:100%;text-align:left;background:#222530;border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:7px;font-size:13px;font-weight:650}.option:hover,.secondary:hover{border-color:var(--muted)}.option[aria-pressed=true]{border-color:var(--lime);background:#2b3227}.option small{color:var(--muted);font:11px ui-monospace,monospace}.blocked{color:var(--amber)!important}.feedback{font-size:12px;margin:8px 0;color:var(--lime)}.feedback.error{color:var(--amber)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.primary,.secondary{border-radius:7px;padding:8px 12px;font-size:12px;font-weight:750}.primary{border:1px solid var(--lime);background:var(--lime);color:#171d11}.secondary{border:1px solid var(--line);background:transparent}.notice{padding:10px;border:1px solid #4b5941;background:#242c23;border-radius:8px;font-size:12px;color:var(--lime);margin-bottom:10px}.section-note{margin:0 0 8px;color:var(--muted);font-size:12px}.footer{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;padding-bottom:24px}.footer .dot{background:#828695}
@media(max-width:820px){.shell{width:calc(100% - 36px)}.layout{grid-template-columns:1fr}.hero{padding-top:23px}.detail{scroll-margin-top:12px}}
@media(max-width:480px){.shell{width:calc(100% - 28px)}.top .shell{height:57px}.brand{font-size:18px}.mark{width:29px;height:29px}.clock{font-size:10px;gap:6px}.clock time{font-size:14px}.hero{display:block;padding:22px 0 15px}.hero h1{margin-bottom:7px}.hero p:last-child{font-size:13px}.boundary{margin-top:13px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:5px}.boundary .eyebrow{font-size:9px;letter-spacing:.7px}.boundary time{font-size:19px}.boundary small{font-size:10px}.layout{gap:12px;padding-bottom:15px}.panel-head{padding:10px 12px}.panel-head h2{font-size:18px}.columns,.row{grid-template-columns:49px minmax(0,1fr) 33px;gap:8px}.columns{padding:5px 12px}.rows{padding:0 5px}.row{min-height:54px;padding:6px}.row time{font-size:14px}.name{font-size:13px}.tag{font-size:9px;margin-top:3px}.legend{padding:7px 12px;font-size:10px}.detail{padding:14px}.detail h2{font-size:22px}}
</style>
</head>
<body>
<header class="top"><div class="shell"><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>Switchboard</div><div class="clock"><span class="dot"></span> STUDIO CLOCK <time datetime="18:42">18:42</time></div></div></header>
<main class="shell">
<header class="hero"><div><p class="eyebrow">Studio rundown</p><h1>Evening changeover</h1><p>Review what’s ready for air before the news handoff.</p></div><div class="boundary"><p class="eyebrow">Next fixed boundary</p><time datetime="19:00">19:00</time><small>18 min to handoff</small></div></header>
<div class="layout">
<section class="panel" aria-labelledby="rundown-title"><div class="panel-head"><h2 id="rundown-title">On-air rundown</h2><span class="status" id="status" role="status"></span></div><div class="columns" aria-hidden="true"><span>Start</span><span>Segment</span><span>Length</span></div><div class="rows" id="rows"></div><div class="legend">Harbor ferry notice must air before 18:50.</div></section>
<section class="panel detail" id="detail" aria-label="Selected segment"></section>
</div>
<div class="footer"><span class="dot"></span> Local studio rundown · Evening shift</div>
</main>
<script>
const segments = [
  {start:'18:43',end:'18:43:45',title:'East Market weather',length:'0:45',state:'Ready',note:'Weather update for the East Market area.'},
  {start:'18:44',end:'18:45:20',title:'Harbor ferry suspension notice',length:'1:20',state:'Ready',note:'Time-sensitive service notice. Air before 18:50.'},
  {start:'18:46',end:'18:51:30',title:'Mara Chen on the night bus pilot',length:'5:30',state:'Awaiting audio',note:'Interview audio hasn’t arrived. Choose a ready recording for this slot.'},
  {start:'18:52',end:'18:55:10',title:'Listener recordings from North Jetty',length:'3:10',state:'Ready',note:'Listener recordings are ready for the 18:52 slot.'},
  {start:'19:00',end:'19:00:30',title:'Station identification and news handoff',length:'0:30',state:'Fixed boundary',note:'Start station identification at the fixed 19:00 news boundary.'}
];
const replacement = {start:'18:46',end:'18:49:45',title:'Depot shift before dawn',length:'3:45',state:'Ready',note:'Studio recording scheduled in the 18:46 slot.'};
let selected = 2;
let changed = false;
let candidate = false;
let conflict = false;
let announcement = '';
const rows = document.querySelector('#rows');
const detail = document.querySelector('#detail');
const status = document.querySelector('#status');
const mobile = matchMedia('(max-width: 820px)');
function rundown() {
  return segments.map((item,index) => changed && index === 2 ? replacement : item);
}
function render() {
  const items = rundown();
  status.textContent = changed ? '● Rundown ready' : '● 1 audio item pending';
  status.classList.toggle('clear',changed);
  rows.innerHTML = items.map((item,index) => '<button class="row" data-index="'+index+'" aria-pressed="'+(index === selected)+'"><time>'+item.start+'</time><span><span class="name">'+item.title+'</span><span class="tag '+(item.state === 'Awaiting audio' ? 'wait' : index === 4 ? 'fixed' : '')+'">'+item.state+(index === 1 ? ' · Air before 18:50' : '')+'</span></span><span class="duration mono">'+item.length+'</span></button>').join('');
  const item = items[selected];
  const pending = selected === 2 && !changed;
  const next = items[selected+1];
  detail.innerHTML = '<div class="detail-top"><p class="eyebrow">Selected segment</p><span class="pill '+(pending ? '' : selected === 4 ? 'fixed' : 'ready')+'">'+item.state+'</span></div>'
    + '<h2 id="segment-title" tabindex="-1">'+item.title+'</h2><div class="timing"><strong>'+item.start+' → '+item.end+'</strong><span>·</span>'+item.length+'</div><p class="description">'+item.note+'</p>'
    + (announcement ? '<div class="notice" role="status">'+announcement+'</div>' : '')
    + (pending ? '<div class="alternates"><h3>Replacement recordings</h3><button class="option" id="depot" aria-pressed="'+candidate+'"><span>Depot shift before dawn</span><small>3:45 · Ready</small></button><button class="option" id="backup" aria-expanded="'+conflict+'" aria-controls="backup-conflict"><span>West platforms accessibility call-in</span><small class="blocked">7:30 · Over slot</small></button>'
      + '<p class="feedback error" id="backup-conflict" role="status" '+(conflict ? '' : 'hidden')+'>From 18:46 this would end at 18:53:30, overlapping the 18:52 North Jetty recordings by 1:30.</p>'
      + (candidate ? '<p class="feedback">Ends at 18:49:45 with 2:15 before North Jetty.</p>' : '') + '</div>' : '')
    + '<div class="actions">'
    + (pending ? '<button class="primary" id="apply" '+(candidate ? '' : 'disabled')+'>Replace segment</button>' : selected === 2 ? '<button class="primary" id="undo">Undo replacement</button>' : '')
    + (next ? '<button class="secondary" id="next" title="'+next.title+'">Next · '+next.start+' →</button>' : '') + '</div>';
}
function select(index, move) {
  selected = index;
  conflict = false;
  announcement = '';
  render();
  if (move || mobile.matches) {
    document.querySelector('#segment-title').focus({preventScroll:true});
    if (mobile.matches) detail.scrollIntoView({block:'start'});
  } else {
    rows.querySelector('[data-index="'+index+'"]').focus();
  }
}
rows.addEventListener('click', event => {
  const row = event.target.closest('[data-index]');
  if (row) select(Number(row.dataset.index),false);
});
detail.addEventListener('click', event => {
  const id = event.target.closest('button')?.id;
  if (!id) return;
  switch(id) {
    case 'depot': candidate = !candidate; break;
    case 'backup': conflict = !conflict; break;
    case 'apply':
      changed = true;
      candidate = false;
      conflict = false;
      announcement = 'Replacement applied. The 18:46 start is unchanged.';
      break;
    case 'undo':
      changed = false;
      announcement = 'Original interview restored. Audio is still pending.';
      break;
    case 'next': select(selected+1,true); return;
    default: return;
  }
  render();
  document.querySelector(id === 'apply' || id === 'undo' ? '#segment-title' : '#'+id).focus({preventScroll:true});
});
render();
</script>
</body>
</html>
