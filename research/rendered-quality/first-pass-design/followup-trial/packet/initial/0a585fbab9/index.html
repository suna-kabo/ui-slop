<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fold Fair — Zine catalogue</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body>
<header><div class="wrap bar"><div class="brand"><span class="mark" aria-hidden="true"></span> Fold Fair</div><button class="short" id="shortlist">Shortlist <span class="count" id="count">0</span></button></div></header>
<main class="wrap"><section class="hero"><h1>Fold Fair</h1><p><strong>Zine catalogue</strong> Browse independent zines and pick the tables you want to visit.</p></section>
<section aria-label="Zine catalogue"><div class="tools"><div class="filters" role="group" aria-label="Filter by topic"></div><span class="total" role="status"></span></div><div class="grid"></div></section></main>
<footer class="wrap footer">Fold Fair · Independent print</footer>
<dialog id="detail-dialog" aria-labelledby="detail-title"><div class="dialog-bar"><span>Zine details</span><button class="close" autofocus>← Back</button></div><div class="row" id="detail-body"></div></dialog>
<dialog id="shortlist-dialog" class="saved" aria-labelledby="shortlist-title"><div class="dialog-bar"><span id="shortlist-title">Your shortlist</span><button class="close" autofocus>Close</button></div><div class="list"></div></dialog>
<div class="sr" role="status" id="announcement"></div>
</body></html>
