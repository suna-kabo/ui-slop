<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#151b20">
<title>Switchboard — Evening changeover</title>
<style>
:root{color-scheme:dark;--ink:#151b20;--deck:#20282f;--line:#37434b;--paper:#f5f1e8;--paperline:#ded8cb;--dim:#aebbc1;--signal:#ff765d;--mint:#a8e2ce;--mono:ui-monospace,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--paper);font:15px/1.45 system-ui,sans-serif}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #65b9e8;outline-offset:-3px}
main,.mast-inner{width:min(1240px,calc(100% - 96px));margin-inline:auto}
.mast{border-bottom:1px solid var(--line)}
.mast-inner{height:65px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:750;letter-spacing:-.7px}
.signal{display:flex;align-items:center;gap:3px;height:24px}
.signal i{width:3px;background:var(--signal);height:8px;border-radius:2px}
.signal i:nth-child(2),.signal i:nth-child(4){height:15px}.signal i:nth-child(3){height:23px}
.clock{font:13px var(--mono);color:var(--dim);white-space:nowrap}.clock strong{color:var(--paper);font-size:16px;margin-left:8px}
.hero{display:flex;justify-content:space-between;align-items:center;gap:28px;padding:37px 0 31px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(34px,4.2vw,64px);letter-spacing:-.065em;line-height:1.02;font-weight:740}
.summary{color:var(--dim);margin-top:12px}.summary strong{color:var(--signal);font-weight:700}.summary .clear{color:var(--mint)}
.handoff{display:grid;grid-template-columns:auto auto;align-items:center;gap:15px;padding:10px 0 10px 19px;border-left:2px solid var(--signal);white-space:nowrap}
.handoff span{color:var(--dim);font-size:13px}.handoff b{display:block;color:var(--paper);font-size:15px}.handoff time{color:var(--signal);font:700 38px/1 var(--mono);letter-spacing:-.08em}
.layout{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(320px,1fr);gap:24px;align-items:start;padding-bottom:36px}
.sheet{background:var(--paper);color:#20272a;border-radius:10px;overflow:hidden}
.sheet-top{display:flex;justify-content:space-between;align-items:baseline;padding:21px 23px 16px;gap:8px}
.sheet-top h2{font-size:25px;letter-spacing:-.04em}.sheet-top span{font:12px var(--mono);color:#565b59}
.columns,.row{display:grid;grid-template-columns:68px minmax(0,1fr) 54px 17px;gap:10px;align-items:center}
.columns{font:11px var(--mono);text-transform:uppercase;letter-spacing:.07em;background:#eae5da;padding:10px 23px;color:#535a57}
.columns span:last-child{text-align:right}
.row{position:relative;width:100%;border:0;border-top:1px solid var(--paperline);background:transparent;color:inherit;text-align:left;padding:15px 23px;min-height:81px}
.row:hover{background:#ece8dd}.row.selected{background:#f8e4d8;box-shadow:inset 4px 0 #bc442f}.row.fixed{border-top:2px solid #988071}.row.selected.fixed{box-shadow:inset 4px 0 #bc442f}
.at,.duration{font-family:var(--mono);font-variant-numeric:tabular-nums}.at{font-size:19px;font-weight:700;letter-spacing:-.07em;align-self:start;margin-top:2px}.duration{text-align:right;color:#464d4c;font-size:14px}
.segment{min-width:0}.segment strong{display:block;font-size:16px;line-height:1.23;letter-spacing:-.015em}
.status{display:flex;align-items:baseline;gap:6px;color:#305e50;font-size:12px;margin-top:5px;flex-wrap:wrap}.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;align-self:center;flex:none}.status.waiting,.status.fixed-label{color:#973c2c}.status small{font-size:inherit;color:#555a58}
.arrow{font-size:19px;color:#565b58;text-align:right}.selected .arrow{color:#a53522}
.inspector{min-width:0;background:var(--deck);border:1px solid var(--line);border-radius:10px;overflow:hidden;scroll-margin-top:12px}
.inspector-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 19px;border-bottom:1px solid var(--line);min-height:55px}
.inspector-head strong{font:700 14px var(--mono);color:var(--signal)}.quiet{border:0;background:transparent;color:var(--dim);padding:7px 4px;min-height:40px;font-size:13px}.quiet:hover{color:white}
.inside{padding:21px 22px}.inside h2{font-size:29px;letter-spacing:-.035em;line-height:1.12;overflow-wrap:break-word}
.state{font-size:13px;margin-top:9px;color:var(--mint);font-weight:650}.state.waiting,.state.fixed-label{color:#ff9b83}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:20px 0;padding:12px 0;border-block:1px solid var(--line)}
.metrics div+div{padding-left:13px;border-left:1px solid var(--line)}
.metrics small{display:block;color:var(--dim);font-size:12px;margin-bottom:2px}.metrics b{font:700 clamp(14px,1.5vw,19px) var(--mono);white-space:nowrap}
.context{font-size:14px;color:#c5cfd2}.context strong{color:var(--paper)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:18px}
.action{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:5px;border:1px solid transparent;min-height:44px;padding:8px 12px;color:#231b18;background:var(--signal);font-weight:750;text-align:left}.action:hover{background:#ff9b85}
.secondary{background:transparent;border-color:#53616a;color:var(--paper)}.secondary:hover{background:#303b43}
.chooser{border-top:1px solid var(--line);margin-top:18px;padding-top:15px}.chooser h3{font-size:16px}.candidates{display:grid;gap:8px;margin-top:10px}
.candidate{width:100%;display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px;background:#182027;color:var(--paper);border:1px solid #53616a;border-radius:5px;text-align:left;padding:10px 12px}.candidate[aria-pressed=true]{border-color:var(--mint);box-shadow:inset 3px 0 var(--mint)}.candidate:hover{background:#2a353d}.candidate small{grid-column:1/-1;color:var(--dim)}.candidate b{font:13px var(--mono)}.conflict{margin-top:10px;color:#ffc0af;background:#382822;padding:10px;border-left:3px solid var(--signal);font-size:14px}
.notice{color:var(--mint);font-size:13px;margin-top:10px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(max-width:960px){main,.mast-inner{width:calc(100% - 48px)}.layout{gap:15px}.columns,.row{grid-template-columns:54px minmax(0,1fr) 42px 13px;gap:8px;padding-inline:16px}.sheet-top{padding-inline:16px}}
@media(max-width:720px){main,.mast-inner{width:calc(100% - 28px)}.mast-inner{height:55px}.brand{font-size:18px}.clock{font-size:11px}.clock strong{font-size:14px;margin-left:4px}.hero{display:block;padding:24px 0 15px}.summary{margin-top:7px;font-size:13px}.handoff{margin-top:14px;padding:5px 0 5px 10px;grid-template-columns:auto 1fr;gap:10px}.handoff time{font-size:25px}.handoff span{display:flex;gap:6px;align-items:baseline;font-size:12px}.handoff b{font-size:13px}.layout{display:block}.inspector{margin-top:14px}.sheet-top{padding-block:12px 10px}.sheet-top h2{font-size:21px}.sheet-top span{font-size:11px}.columns,.row{padding-inline:12px}.columns{padding-block:7px;font-size:10px}.row{min-height:65px;padding-block:9px}.at{font-size:17px}.segment strong{font-size:14px}.status{font-size:11px;margin-top:3px}.duration{font-size:13px}.inside{padding:16px}.inside h2{font-size:25px}.inspector-head{padding-inline:15px}.metrics b{font-size:17px}}
@media(max-width:350px){.columns,.row{grid-template-columns:45px minmax(0,1fr) 34px 9px;gap:5px}.handoff span{display:block}}
</style>
</head>
<body>
<header class="mast"><div class="mast-inner"><div class="brand"><span class="signal" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>Switchboard</div><div class="clock">Studio clock <strong>18:42</strong></div></div></header>
<main>
<header class="hero"><div><h1>Evening changeover</h1><p class="summary" id="summary"></p></div><div class="handoff"><time datetime="19:00">19:00</time><span><b>Fixed handoff</b> in 18 min</span></div></header>
<div class="layout">
<section class="sheet" aria-labelledby="rundown"><div class="sheet-top"><h2 id="rundown" tabindex="-1">Rundown</h2><span>18:43–19:00</span></div><div class="columns" aria-hidden="true"><span>Air time</span><span>Segment</span><span>Length</span></div><div id="rows"></div></section>
<section class="inspector" id="inspector" aria-labelledby="detail-title"></section>
</div>
<div class="sr" id="live" role="status"></div>
</main>
<script>
const schedule = [
  {start:'18:43', title:'East Market weather', seconds:45, state:'Ready'},
  {start:'18:44', title:'Harbor ferry suspension notice', seconds:80, state:'Ready', deadline:'18:50'},
  {start:'18:46', title:'Mara Chen on the night bus pilot', seconds:330, state:'Awaiting audio'},
  {start:'18:52', title:'Listener recordings from North Jetty', seconds:190, state:'Ready'},
  {start:'19:00', title:'Station identification and news handoff', seconds:30, state:'Fixed boundary'}
];
const replacement = {title:'Depot shift before dawn', seconds:225, state:'Ready'};
const backup = {title:'West platforms accessibility call-in', seconds:450, state:'Ready'};
const editedSlot = 2;
const storageKey = 'switchboard-evening-replacement';
const rows = document.querySelector('#rows');
const inspector = document.querySelector('#inspector');
const summary = document.querySelector('#summary');
const live = document.querySelector('#live');
let changed = false;
try { changed = sessionStorage.getItem(storageKey) === 'true'; } catch {}
let selected = editedSlot;
let choosing = false;
let conflict = false;
const current = index => index === editedSlot && changed ? {...schedule[index], ...replacement} : schedule[index];
const stateClass = item => item.state === 'Awaiting audio' ? 'waiting' : item.state === 'Fixed boundary' ? 'fixed-label' : '';
const pad = value => String(value).padStart(2,'0');
const duration = seconds => Math.floor(seconds / 60) + ':' + pad(seconds % 60);
function clockSeconds(time) {
  const [hours, minutes] = time.split(':').map(Number);
  return hours * 3600 + minutes * 60;
}
function endTime(start, length) {
  const end = clockSeconds(start) + length;
  return pad(Math.floor(end / 3600)) + ':' + pad(Math.floor(end / 60) % 60) + ':' + pad(end % 60);
}
function render() {
  summary.innerHTML = changed ? '<strong class="clear">4 ready</strong> · all scheduled audio available' : '3 ready · <strong>1 awaiting audio</strong>';
  rows.innerHTML = schedule.map((slot,index) => {
    const item = current(index);
    return `<button type="button" class="row ${index === selected ? 'selected' : ''} ${index === schedule.length - 1 ? 'fixed' : ''}" id="slot-${index}" data-slot="${index}" aria-controls="inspector" aria-current="${index === selected ? 'true' : 'false'}">
      <time class="at">${item.start}</time><span class="segment"><strong>${item.title}</strong><span class="status ${stateClass(item)}">${item.state}${item.deadline ? '<small>· Air before ' + item.deadline + '</small>' : ''}${index === editedSlot && changed ? '<small>· Ends ' + endTime(item.start,item.seconds) + '</small>' : ''}</span></span><span class="duration">${duration(item.seconds)}</span><span class="arrow" aria-hidden="true">›</span></button>`;
  }).join('');
  const item = current(selected);
  const next = schedule[selected + 1];
  const edit = selected === editedSlot;
  const end = endTime(item.start,item.seconds);
  let context = '';
  if (item.deadline) context = 'Must air before <strong>' + item.deadline + '</strong>.';
  else if (edit && !changed) context = 'Next cue at <strong>18:52</strong>. Up to <strong>6:00</strong> available for a replacement.';
  else if (edit) context = '<strong>2:15</strong> clear before the 18:52 cue.';
  else if (!next) context = 'Fixed start for station identification and the news handoff.';
  const picker = choosing ? `<section class="chooser" aria-labelledby="chooser-title">
    <h3 id="chooser-title" tabindex="-1">Replacement for 18:46</h3>
    <div class="candidates">
      <button type="button" id="depot" class="candidate" data-action="depot" aria-pressed="true"><strong>${replacement.title}</strong><b>${duration(replacement.seconds)}</b><small>Ready · Fits · Ends ${endTime(item.start,replacement.seconds)}</small></button>
      <button type="button" id="backup" class="candidate" data-action="backup" aria-expanded="${conflict}" aria-controls="conflict"><strong>${backup.title}</strong><b>${duration(backup.seconds)}</b><small>Ready · Overruns next cue</small></button>
    </div>
    <p id="conflict" class="conflict" ${conflict ? '' : 'hidden'}>Would end at ${endTime(item.start,backup.seconds)}, which overlaps the 18:52 North Jetty cue by 1:30. Depot shift before dawn stays selected.</p>
    <div class="actions"><button type="button" id="apply" class="action" data-action="apply">Use selected recording</button><button type="button" class="quiet" data-action="cancel">Cancel</button></div>
  </section>` : '';
  inspector.innerHTML = `<div class="inspector-head"><strong>Detail · ${item.start}</strong><button type="button" class="quiet" data-action="return">↑ Rundown</button></div>
    <div class="inside"><h2 id="detail-title" tabindex="-1">${item.title}</h2><p class="state ${stateClass(item)}">${item.state}${edit && changed ? ' · Replacement' : ''}</p>
    <div class="metrics"><div><small>Starts</small><b>${item.start}</b></div><div><small>Length</small><b>${duration(item.seconds)}</b></div><div><small>Ends</small><b>${end}</b></div></div>
    ${context ? '<p class="context">' + context + '</p>' : ''}
    ${edit && changed ? '<p class="notice">Replaced Mara Chen on the night bus pilot.</p>' : ''}
    <div class="actions">
      ${edit && !choosing ? (changed ? '<button type="button" id="undo" class="action secondary" data-action="undo">Undo replacement</button>' : '<button type="button" id="replace" class="action" data-action="replace">Find replacement <span aria-hidden="true">→</span></button>') : ''}
      ${next && !choosing ? '<button type="button" id="next" class="quiet" data-action="next">Next cue · ' + next.start + ' →</button>' : ''}
    </div>${picker}</div>`;
}
function focus(id) {
  const target = document.getElementById(id);
  target.focus({preventScroll:true});
  target.scrollIntoView({block:'nearest'});
}
function openSlot(index) {
  selected = index;
  choosing = false;
  conflict = false;
  render();
  focus('detail-title');
}
function setReplacement(value) {
  changed = value;
  choosing = false;
  conflict = false;
  try { sessionStorage.setItem(storageKey,String(value)); } catch {}
  render();
  live.textContent = value ? 'Replacement applied at 18:46. Ends at 18:49:45.' : 'Original 18:46 interview restored. Awaiting audio.';
  focus('detail-title');
}
rows.addEventListener('click', event => {
  const button = event.target.closest('[data-slot]');
  if (button) openSlot(Number(button.dataset.slot));
});
inspector.addEventListener('click', event => {
  const button = event.target.closest('[data-action]');
  if (!button) return;
  switch (button.dataset.action) {
    case 'replace': choosing = true; render(); focus('chooser-title'); break;
    case 'backup': {
      conflict = !conflict;
      document.querySelector('#conflict').hidden = !conflict;
      button.setAttribute('aria-expanded',String(conflict));
      if (conflict) live.textContent = document.querySelector('#conflict').textContent;
      break;
    }
    case 'depot': {
      conflict = false;
      document.querySelector('#conflict').hidden = true;
      document.querySelector('#backup').setAttribute('aria-expanded','false');
      live.textContent = 'Depot shift before dawn selected.';
      break;
    }
    case 'cancel': choosing = false; conflict = false; render(); focus('replace'); break;
    case 'apply': setReplacement(true); break;
    case 'undo': setReplacement(false); break;
    case 'next': openSlot(selected + 1); break;
    case 'return': focus('slot-' + selected); break;
  }
});
render();
</script>
</body>
</html>
