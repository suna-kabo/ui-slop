 if(!shortlist&&order==='name')all.sort((a,b)=>a[0].localeCompare(b[0]));
 $('#count').textContent=shortlist?all.length+' saved':all.length+' of '+places.length+' places';
 $('#results').innerHTML=all.length?'<div class="grid">'+all.map(card).join('')+'</div>':'<section class="empty"><h3>'+(shortlist?'Your shortlist is empty':'No matching places')+'</h3><p>'+(shortlist?'Save an outing to find it here later.':'Try another setting or clear the access filter.')+'</p>'+(shortlist?'<a class="back" data-route href="#">Browse places</a>':'<button class="clear" data-reset>Clear filters</button>')+'</section>';
}
function browse(shortlist){
 return (shortlist?'':'<section class="hero"><div class="wrap hero-inner"><div class="hero-copy"><h1>Coast &amp; Current</h1><p>Find a half-day outing by the water.</p></div><img src="'+masthead+'" alt=""></div></section>')+
 '<section class="wrap catalog'+(shortlist?' shortlist':'')+'"><div class="sectionhead">'+(shortlist?'<h1 tabindex="-1">Shortlist</h1>':'<h2 tabindex="-1">Explore the coast</h2>')+'<p id="count" class="count" role="status"></p></div>'+
 (shortlist?'':'<div class="controls"><div class="filters" role="group" aria-label="Setting">'+settings.map(x=>'<button type="button" class="pill" data-setting="'+x+'" aria-pressed="'+(filter===x)+'">'+x+'</button>').join('')+'</div><div class="tools"><label class="toggle"><input id="access" type="checkbox" '+(stepFree?'checked':'')+'> Step-free</label><label>Sort by <select id="sort"><option value="guide">Guide order</option><option value="duration">Shortest visit</option><option value="name">Name A–Z</option></select></label></div></div>')+'<div id="results"></div></section>';
}
function detail(index){
 const p=places[index], origin=history.state?.origin;
 return '<article class="wrap detail"><a class="back" data-close href="#'+(origin==='shortlist'?'shortlist':'')+'"><span aria-hidden="true">←</span> '+(origin==='shortlist'?'Back to shortlist':'Back to places')+'</a><div class="spread"><img src="'+imagery[index]+'" alt="'+p[7]+'"><div><p class="meta">'+p[1]+' <span class="dot" aria-hidden="true">/</span> '+p[2]+' min</p><h1 tabindex="-1">'+p[0]+'</h1>'+saveButton(ids[index])+'<dl class="facts"><div><dt>Terrain</dt><dd>'+p[3]+'</dd></div><div><dt>Open</dt><dd>'+p[4]+'</dd></div><div><dt>Getting there</dt><dd>'+p[5]+'</dd></div></dl><p class="visit">'+p[6]+'</p></div></div></article>';
}
function render(next, restore=null, moveFocus=true){
 current=next;
 if(next===''&&restore?.catalog)({filter,stepFree,order}=restore.catalog);
 document.title=(ids.includes(next)?places[ids.indexOf(next)][0]+' | ':next==='shortlist'?'Shortlist | ':'')+'Coast & Current';
 $('main').innerHTML=ids.includes(next)?detail(ids.indexOf(next)):browse(next==='shortlist');
 if(!ids.includes(next)){if($('#sort'))$('#sort').value=order;list();}
 navState();
 if(moveFocus){
   const focus=restore?.focus?document.getElementById(restore.focus):null;
   (focus||$('main .detail h1, main .sectionhead :is(h1,h2)'))?.focus({preventScroll:true});
   window.scrollTo(0,restore?.y||0);
 }
}
function go(next, focus){
 if(next===current)return;
 const catalog={filter,stepFree,order};
 history.replaceState({...history.state,focus,y:window.scrollY,catalog},'');
 history.pushState({origin:current,inside:true,catalog},'','#'+next);
 render(next);
}
window.addEventListener('popstate',()=>{
 const next=route();
 if(next!==current)render(next,history.state);
});
document.addEventListener('click',event=>{
 const target=event.target.closest('button,a');
 if(!target)return;
 if(target.matches('.skip')){
  event.preventDefault();$('main').focus();$('main').scrollIntoView();
 }else if(target.matches('[data-close]')&&!event.ctrlKey&&!event.metaKey&&!event.shiftKey&&!event.altKey){
  event.preventDefault();
  if(history.state?.inside)history.back();else go('',null);
 }else if(target.matches('[data-route]')&&!event.ctrlKey&&!event.metaKey&&!event.shiftKey&&!event.altKey){
  event.preventDefault();
  const next=decodeRoute(target.hash.slice(1));
  go(next,ids.includes(next)?'link-'+next:target.id||null);
 }else if(target.matches('[data-setting]')){
  filter=target.dataset.setting;
  for(const button of document.querySelectorAll('[data-setting]'))button.setAttribute('aria-pressed',button===target);
  list();recordCatalog();
 }else if(target.matches('[data-reset]')){
  filter='All places';stepFree=false;$('#access').checked=false;
  for(const button of document.querySelectorAll('[data-setting]'))button.setAttribute('aria-pressed',button.dataset.setting===filter);
  list();recordCatalog();$('[data-setting]').focus();
 }else if(target.matches('[data-save]')){
  const id=target.dataset.save,remove=saved.has(id), name=places[ids.indexOf(id)][0];
  if(remove)saved.delete(id);else saved.add(id);
  try{localStorage.setItem(key,JSON.stringify([...saved]));storageFailed=false;}catch{storageFailed=true;}
  if(current==='shortlist'&&remove){
   const card=target.closest('.card');
   const neighbor=card.nextElementSibling?.querySelector('.save')||card.previousElementSibling?.querySelector('.save');
   const nextId=neighbor?.dataset.save;
   list();
   (nextId?$('[data-save="'+nextId+'"]'):$('[data-route].back'))?.focus();
  }else{
   target.setAttribute('aria-pressed',!remove);target.querySelector('span').textContent=remove?'Save':'Saved';
  }
  navState();
  $('#announcer').textContent=(remove?'Removed '+name+' from shortlist.':'Saved '+name+' to shortlist.')+(storageFailed?' Browser storage is unavailable.':'');
  $('#storage').hidden=!storageFailed;
 }
});
function recordCatalog(){
 history.replaceState({...history.state,catalog:{filter,stepFree,order}},'');
}
document.addEventListener('change',event=>{
 if(event.target.id==='access'){stepFree=event.target.checked;list();recordCatalog();}
 if(event.target.id==='sort'){order=event.target.value;list();recordCatalog();}
});
if(history.state?.catalog)({filter,stepFree,order}=history.state.catalog);
render(route(),history.state,false);
$('#storage').hidden=!storageFailed;

$("#mark").innerHTML=icons.brand;</script></body></html>
